# Builds the image from this checkout and runs it. Deploy or update with:
#
#   git pull && docker compose up -d --build
#
# Settings come from .env next to this file (cp deploy/docker/env.example .env).
# It is required: without it ACCESS_PASSWORD would silently be unset.
# To pull a prebuilt image instead of building here, see deploy/docker/.
name: crb-statement-analyzer
services:
  underwriter:
    build: .
    image: crb-statement-analyzer:local
    container_name: crb-statement-analyzer
    env_file: .env
    # Localhost by default, so nginx is the one way in: Docker's port rules
    # bypass ufw. BIND_ADDRESS=0.0.0.0 in .env shares it on the LAN directly.
    # HOST_PORT moves it off 8000 when something else already holds that port.
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-8000}:8000"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    # Google service-account key for Save to Sheets: put it in ./secrets/ and
    # point GOOGLE_SERVICE_ACCOUNT_FILE at /run/secrets/<file> in .env. Mounted,
    # never baked into the image; secrets/ is ignored by git and Docker.
    volumes:
      - ./secrets:/run/secrets:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
